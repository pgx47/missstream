name: Publish guide

on:
  schedule:
    - cron: "0 8 * * 1,4" # lundi & jeudi 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Generate article
        run: python scripts/generate_article.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}

      - name: Commit new guide
        run: |
          git config user.name "missstream-bot"
          git config user.email "bot@missstream.xyz"
          git add src/content/guides public/images/guides scripts/topics.json
          if git diff --cached --quiet; then
            echo "Rien à committer"
          else
            git commit -m "guide: génération automatique [skip ci]"
            git push
          fi
