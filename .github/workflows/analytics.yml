name: Configure privacy-friendly analytics
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Enable existing-site analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/configure_analytics.py
      - name: Save public analytics configuration and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "missstream-bot"
          git config user.email "bot@missstream.xyz"
          git add src/data/analytics.json
          if ! git diff --cached --quiet; then
            git commit -m "analytics: intégration audience sans cookie"
            git pull --rebase origin main
            git push
          fi
          gh workflow run deploy.yml
