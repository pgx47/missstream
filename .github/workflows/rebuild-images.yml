name: Rebuild images (FLUX)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Regenerate all images via Workers AI FLUX
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
        run: python3 scripts/rebuild_all_images.py
      - name: Commit regenerated images
        run: |
          git config user.name "missstream-bot"
          git config user.email "bot@missstream.xyz"
          git add src/data/lookbook.json src/content public/images
          if git diff --cached --quiet; then
            echo "Rien à committer"; exit 0
          fi
          git commit -m "images: régénération FLUX (sans watermark)"
          git push
