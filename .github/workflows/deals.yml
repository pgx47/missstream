name: Refresh deals

on:
  schedule:
    - cron: "0 6 * * 1,3,5" # lun/mer/ven 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Fetch deals
        run: python scripts/fetch_deals.py
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}

      - name: Commit deals
        run: |
          git config user.name "missstream-bot"
          git config user.email "bot@missstream.xyz"
          git add src/data/deals.json
          if git diff --cached --quiet; then
            echo "Deals inchangés"
          else
            git commit -m "deals: actualisation quotidienne"
            git push
          fi

      - name: Ping IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python scripts/indexnow.py
