name: Cloudflare zone settings
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [read, disable-bot-block, read-bots, allow-ai-crawlers]
        default: read
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Zone settings
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZID=972c53b0f759ce08c9b4f1917365fa07
          for s in super_bot_fight_mode bot_fight_mode security_level browser_check hotlink_protection; do
            echo "== $s"; curl -s "https://api.cloudflare.com/client/v4/zones/$ZID/settings/$s" -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('result',{}).get('value') if d.get('success') else d.get('errors'))"
          done
          if [ "${{ inputs.action }}" = "disable-bot-block" ]; then
            for s in super_bot_fight_mode bot_fight_mode; do
              echo "disable $s"; curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZID/settings/$s" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"value":"off"}'
            done
            curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZID/settings/security_level" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"value":"low"}'
            curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZID/settings/browser_check" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"value":"off"}'
          fi
      - name: Managed robots.txt
        if: inputs.action == 'read-bots' || inputs.action == 'allow-ai-crawlers'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZID: 972c53b0f759ce08c9b4f1917365fa07
          ACTION: ${{ inputs.action }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          KEYS = ("bot_preference_sync_enabled", "is_robots_txt_managed", "ai_search",
                  "ai_training", "ai_user", "ai_bots_protection", "crawler_protection",
                  "cf_robots_variant")
          url = f"https://api.cloudflare.com/client/v4/zones/{os.environ['ZID']}/bot_management"
          headers = {"Authorization": f"Bearer {os.environ['CF_TOKEN']}",
                     "Content-Type": "application/json"}

          def call(method, body=None):
              req = urllib.request.Request(
                  url, method=method,
                  data=json.dumps(body).encode() if body else None,
                  headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  return json.load(e)

          def show(tag, payload):
              result = payload.get("result") or {}
              if not isinstance(result, dict):
                  print(tag, payload.get("errors"))
                  return
              print(tag, {k: result.get(k) for k in KEYS})

          current = call("GET")
          if not current.get("success"):
              print("lecture impossible :", current.get("errors"))
              raise SystemExit(1)
          show("avant :", current)

          if os.environ["ACTION"] == "allow-ai-crawlers":
              read_only = ("using_latest_model", "ai_bots_migration_opt_out")
              body = {k: v for k, v in current["result"].items() if k not in read_only}
              body.update({
                  "bot_preference_sync_enabled": False,
                  "is_robots_txt_managed": False,
                  "ai_training": "disabled",
                  "ai_bots_protection": "disabled",
                  "ai_search": "disabled",
                  "ai_user": "disabled",
                  "cf_robots_variant": "off",
              })
              res = call("PUT", body)
              print("PUT", res.get("success"), res.get("errors") or "")
              if not res.get("success"):
                  raise SystemExit(1)
              show("après :", res)
          PY
