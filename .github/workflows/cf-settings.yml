name: Cloudflare zone settings
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [read, disable-bot-block]
        default: read
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zone settings
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZID=972c53b0f759ce08c9b4f1917365fa07
          for s in super_bot_fight_mode bot_fight_mode security_level browser_check hotlink_protection; do
            echo "== $s"; curl -s "https://api.cloudflare.com/client/v4/zones/$ZID/settings/$s" -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('result',{}).get('value') if d.get('success') else d.get('errors'))"
          done
          if [ "${{ inputs.action }}" = "disable-bot-block" ]; then
            for s in super_bot_fight_mode bot_fight_mode; do
              echo "disable $s"; curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZID/settings/$s" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"value":"off"}'
            done
            curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZID/settings/security_level" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"value":"low"}'
            curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZID/settings/browser_check" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"value":"off"}'
          fi
