name: Refresh streamers (trimestriel)
on:
  schedule:
    - cron: "0 7 1 1,4,7,10 *" # 1er janv/avril/juil/oct 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Refresh streamers material + bio
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python scripts/refresh_streamers.py
      - name: Commit
        run: |
          git config user.name "missstream-bot"
          git config user.email "bot@missstream.xyz"
          git add src/data/streamers.json public/images/products
          if git diff --cached --quiet; then
            echo "Rien à committer"; exit 0
          fi
          git commit -m "streamers: refresh trimestriel matériel + bios"
          git push
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml || true
