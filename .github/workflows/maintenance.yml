name: Maintenance

on:
  schedule:
    - cron: "0 6 * * 0" # dimanche 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deps
        run: pip install -r scripts/requirements.txt

      - name: Refresh produits (ASINs, étoiles, avis)
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python scripts/refresh_products.py

      - name: Ajoute nouveaux profils streamers
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python scripts/expand_streamers.py

      - name: Expand deco + lookbook + dupes
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
        run: python scripts/expand_content.py

      - name: Régénère dupes/packs/lookbook
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build_feature_pages.py

      - name: Commit
        run: |
          git config user.name "missstream-bot"
          git config user.email "bot@missstream.xyz"
          git add src/data/ src/content/ public/images/
          if git diff --cached --quiet; then
            echo "Rien à committer"
          else
            git commit -m "maintenance: refresh produits + pages features"
            git push
          fi


      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml || true
